<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB Business Toolkit Master 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="app" class="w-full max-w-6xl min-h-[850px] max-h-[95vh] bg-white rounded-[60px] shadow-2xl overflow-hidden border-[12px] border-white p-8 md:p-12 flex flex-col relative">
        <!-- Content injected by JavaScript -->
    </div>

    <script>
        // --- DATA STRUCTURES ---
        const state = {
            view: 'welcome',
            activeSteepleTab: 'S',
            revealedAnswers: {},
            activeToolQs: null
        };

        const toolQuestions = {
            swot: [
                { q: "Define an internal 'Strength' for a tech firm.", a: "A unique resource like a patented algorithm or a highly skilled R&D team." },
                { q: "Difference between Opportunity and Strength?", a: "Opp is external (market gap); Strength is internal (good location)." },
                { q: "Why is SWOT considered 'subjective'?", a: "It depends on the manager's personal perspective and bias." },
                { q: "How to turn a Threat into an Opportunity?", a: "A rival's closure (Threat to industry) becomes an Opp for you to grab share." },
                { q: "Identify two common Weaknesses for startups.", a: "Low brand awareness and limited cash flow." },
                { q: "Why is SWOT just a 'snapshot'?", a: "Market conditions and internal staff change constantly." },
                { q: "Risk of too many points in SWOT?", a: "Analysis paralysis—losing focus on the critical strategic issues." },
                { q: "How does SWOT help in 'Planning'?", a: "It provides the evidence needed to set realistic objectives." },
                { q: "Can a factor be both an Opp and a Threat?", a: "Yes, new tech is an Opp for efficiency but a Threat to current jobs." },
                { q: "Evaluate SWOT for a large MNC.", a: "Useful for single products, but too simple for a complex global corporation." }
            ],
            steeple: [
                { q: "Define the 'Social' factor.", a: "Demographic changes or lifestyle trends (e.g., preference for green products)." },
                { q: "How do rising interest rates affect demand?", a: "Increases borrowing costs, reducing consumer disposable income/spending." },
                { q: "Identify one 'Legal' factor for food.", a: "Food safety standards or mandatory nutritional labeling laws." },
                { q: "How tech change leads to shorter PLCs?", a: "Rapid innovation makes older products obsolete faster." },
                { q: "Environmental pressure on car firms?", a: "Government carbon taxes and consumer demand for EVs." },
                { q: "Why is Political stability important?", a: "Reduces risk of sudden law changes or asset seizure." },
                { q: "Define 'Ethical' behavior.", a: "Actions that go beyond laws, like ensuring fair wages in the supply chain." },
                { q: "How do STEEPLE factors interrelate?", a: "Tech (Internet) changed Social habits (remote work), affecting Economic rents." },
                { q: "Economic factor affecting B2B firms?", a: "Changes in industrial electricity prices or corporate tax rates." },
                { q: "Discuss limitations of STEEPLE.", a: "It is predictive; forecasts about the future can be completely wrong." }
            ],
            ansoff: [
                { q: "Define 'Market Penetration'.", a: "Selling more of the same products to the same target customers." },
                { q: "Which quadrant is most risky?", a: "Diversification—new products in unknown new markets." },
                { q: "Explain 'Product Development'.", a: "Apple releasing the Vision Pro to its existing fanbase." },
                { q: "How Market Dev differs from Penetration?", a: "Market Dev seeks new segments or geographies (e.g., selling to China)." },
                { q: "Why choose 'Diversification'?", a: "To spread risk so the firm isn't dependent on one single industry." },
                { q: "Branding's role in Market Development?", a: "A trusted brand name makes entering a new country easier." },
                { q: "Which strategy needs most R&D?", a: "Product Development." },
                { q: "How Ansoff links to PLC?", a: "Penetration is for Growth; Diversification for products in Decline." },
                { q: "Why is Penetration low risk?", a: "The firm understands both the product and the customer behavior." },
                { q: "Evaluate Ansoff for capital-poor firms.", a: "Penetration is best as it requires the least new investment." }
            ],
            bcg: [
                { q: "Define a 'Cash Cow'.", a: "High market share in a slow-growth industry; generates steady cash." },
                { q: "What to do with a 'Dog' product?", a: "Harvest (milk remaining cash) or Divest (sell it off)." },
                { q: "Link between 'Stars' and market growth.", a: "Stars need high growth to justify high marketing investment." },
                { q: "Why are 'Question Marks' risky?", a: "They require cash but might never gain enough market share." },
                { q: "How can a Cow fund a Star?", a: "Surplus cash from Cows pays for the Star's expensive promotion." },
                { q: "Define 'Market Share'.", a: "The percentage of total industry sales held by one firm." },
                { q: "What happens to Star when growth stops?", a: "It naturally transitions into a Cash Cow." },
                { q: "Objective for a Question Mark?", a: "Build market share to turn it into a Star." },
                { q: "Limitation of BCG?", a: "Ignores external STEEPLE factors and brand image." },
                { q: "Importance of balanced portfolio?", a: "Ensures future cash (Stars) replaces current earners (Cows)." }
            ]
        };

        const bizPlanTheory = {
            purpose: [
                { t: "Finance", d: "Essential for securing external funding from banks, venture capitalists, or business angels." },
                { t: "Clarity", d: "Provides a roadmap for management, ensuring everyone works toward the same strategic goals." },
                { t: "Risk Reduction", d: "Forcing a detailed analysis of the market (SWOT/STEEPLE) identifies potential pitfalls early." },
                { t: "Benchmarks", d: "Sets SMART objectives that actual performance can be measured against later." }
            ],
            limitations: [
                { t: "Static Nature", d: "Plans are often outdated by the time they are finished due to rapid external changes." },
                { t: "Forecast Inaccuracy", d: "Financial projections are 'best guesses' and often over-optimistic." },
                { t: "Opportunity Cost", d: "The time spent researching and drafting could have been spent on sales or operations." },
                { t: "Rigidity", d: "Over-reliance on a plan can stop a business from pivoting quickly to new opportunities." }
            ]
        };

        const abcCasePlan = [
            { 
                section: "Executive Summary", 
                questions: [
                    "What is ABC's core mission regarding the circular economy?",
                    "Identify the 50 million tonne problem ABC is solving.",
                    "What are the two distinct revenue streams (Concrete vs Gold)?",
                    "State the key milestone for the 2024 factory opening.",
                    "What is the primary funding need for their growth options?"
                ],
                abcFocus: "Abraca (ABC) transitions concrete production toward a circular model using room-temp gold recovery."
            },
            { 
                section: "Business Description", 
                questions: [
                    "Explain the 'USP' of room-temperature recovery vs burning.",
                    "Define the 'carbon-intensive' process they are replacing.",
                    "Which discarded products supply their raw materials?",
                    "What are the implications of being a B2B operator?",
                    "How does ABC define its 'Market Orientation' strategy?"
                ],
                abcFocus: "USP: Precious metal recovery without carbon-intensive heat. Leading the waste-to-resource shift."
            },
            { 
                section: "Market Analysis", 
                questions: [
                    "Who are the primary buyers for recovered gold in the jewellery market?",
                    "Describe the 'aggregates' market in the construction industry.",
                    "How does the '80% landfill' statistic represent an Opportunity?",
                    "Analyze the competitive threat from traditional concrete makers.",
                    "How do environmental subsidies (STEEPLE) affect market demand?"
                ],
                abcFocus: "Dual Markets: High-end luxury (Gold) and Infrastructure stability (Concrete Aggregates)."
            },
            { 
                section: "Marketing Strategy", 
                questions: [
                    "Should ABC use 'Premium Pricing' for its sustainable gold?",
                    "What 'Place' strategy is best for bulk concrete delivery?",
                    "How can 'Green Branding' differentiate ABC's aggregates?",
                    "Suggest a 'Below-the-Line' promotion for jewellery makers.",
                    "How does 'Physical Evidence' (the factory) support their brand image?"
                ],
                abcFocus: "Green Positioning: Differentiation through verifiable 80% e-waste reduction."
            },
            { 
                section: "Operations & HR", 
                questions: [
                    "How will ABC scale its processing capacity from 100 tonnes/week?",
                    "What training do 'People' need for high-tech gold recovery?",
                    "What logistics are required to source circuit boards globally?",
                    "How does 'Process' efficiency reduce the environmental impact?",
                    "Identify the key machinery needed for shredding and recovery."
                ],
                abcFocus: "Operational Scale: Moving from kilograms to tonnes while managing toxic metal safety."
            },
            { 
                section: "Financials", 
                questions: [
                    "Identify the fixed costs involved in the factory opening.",
                    "How does room-temperature processing affect variable energy costs?",
                    "What is the impact of gold price volatility on their cash flow?",
                    "Determine the estimated break-even point for expansion.",
                    "What are the financial risks of the 'growth options' mentioned?"
                ],
                abcFocus: "Financial Pivot: High R&D/CapEx costs versus long-term efficiency and 'Circular' profit."
            }
        ];

        // --- RENDER LOGIC ---

        function setView(newView) {
            state.view = newView;
            state.activeToolQs = null;
            state.revealedAnswers = {};
            render();
        }

        function toggleToolQs(tool) {
            state.activeToolQs = state.activeToolQs === tool ? null : tool;
            render();
        }

        function toggleAnswer(id) {
            state.revealedAnswers[id] = !state.revealedAnswers[id];
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (state.view === 'welcome') {
                app.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center p-6 h-full space-y-8 animate-in">
                        <div class="bg-sky-600 p-8 rounded-full shadow-2xl">
                            <i class="fa-solid fa-layer-group text-white text-6xl"></i>
                        </div>
                        <div>
                            <h1 class="text-5xl font-black text-slate-900 tracking-tight italic">IB Master Toolkit 2026</h1>
                            <p class="text-slate-500 mt-2 text-xl">Integrated Toolkit & Abraca (ABC) Case Builder</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 w-full max-w-5xl">
                            <button onclick="setView('situational')" class="p-6 bg-white border-4 border-emerald-100 rounded-[40px] hover:scale-105 transition-all group shadow-sm flex flex-col items-center">
                                <i class="fa-solid fa-shield-halved text-3xl text-emerald-500 mb-3"></i>
                                <h3 class="font-black text-sm uppercase tracking-wider text-slate-700">SWOT & STEEPLE</h3>
                            </button>
                            <button onclick="setView('growth')" class="p-6 bg-white border-4 border-indigo-100 rounded-[40px] hover:scale-105 transition-all group shadow-sm flex flex-col items-center">
                                <i class="fa-solid fa-chart-line text-3xl text-indigo-500 mb-3"></i>
                                <h3 class="font-black text-sm uppercase tracking-wider text-slate-700">Decision Tools</h3>
                            </button>
                            <button onclick="setView('planning')" class="p-6 bg-white border-4 border-orange-100 rounded-[40px] hover:scale-105 transition-all group shadow-sm flex flex-col items-center">
                                <i class="fa-solid fa-file-invoice text-3xl text-orange-500 mb-3"></i>
                                <h3 class="font-black text-sm uppercase tracking-wider text-slate-700">Planning Theory</h3>
                            </button>
                            <button onclick="setView('abc-case')" class="p-6 bg-white border-4 border-sky-200 rounded-[40px] hover:scale-105 transition-all group shadow-sm flex flex-col items-center">
                                <i class="fa-solid fa-recycle text-3xl text-sky-500 mb-3"></i>
                                <h3 class="font-black text-sm uppercase tracking-wider text-slate-700">ABC Case Lab</h3>
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'planning') {
                app.innerHTML = `
                    <div class="space-y-8 animate-in flex flex-col h-full overflow-hidden">
                        <div class="flex items-center justify-between">
                            <button onclick="setView('welcome')" class="flex items-center gap-2 text-sky-600 font-bold hover:underline">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <div class="bg-orange-100 text-orange-700 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest">Business Plan Theory</div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-shrink-0">
                            <div class="bg-white p-8 rounded-[40px] border-4 border-orange-100 shadow-xl">
                                <h3 class="font-black text-xl mb-4 text-orange-600 flex items-center gap-2">
                                    <i class="fa-solid fa-check-circle"></i> Why write a plan?
                                </h3>
                                <ul class="space-y-4">
                                    ${bizPlanTheory.purpose.map(p => `
                                        <li class="border-l-4 border-orange-200 pl-4">
                                            <span class="font-black text-slate-800 text-sm">${p.t}: </span>
                                            <span class="text-xs text-slate-500">${p.d}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                            <div class="bg-white p-8 rounded-[40px] border-4 border-rose-100 shadow-xl">
                                <h3 class="font-black text-xl mb-4 text-rose-600 flex items-center gap-2">
                                    <i class="fa-solid fa-triangle-exclamation"></i> Limitations
                                </h3>
                                <ul class="space-y-4">
                                    ${bizPlanTheory.limitations.map(l => `
                                        <li class="border-l-4 border-rose-200 pl-4">
                                            <span class="font-black text-slate-800 text-sm">${l.t}: </span>
                                            <span class="text-xs text-slate-500">${l.d}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>

                        <div class="bg-slate-900 text-white p-8 rounded-[50px] shadow-2xl flex-grow overflow-y-auto scrollbar-hide">
                            <h3 class="text-2xl font-black mb-6 text-orange-400">Core Elements (Syllabus 1.2)</h3>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                                ${["Executive Summary", "Business Description", "Marketing Strategy", "Operations", "Human Resources", "Financial Forecasts"].map((el, i) => `
                                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center">
                                        <p class="text-[10px] font-bold uppercase text-orange-300 mb-1">Step ${i+1}</p>
                                        <p class="text-sm font-black">${el}</p>
                                    </div>
                                `).join('')}
                            </div>
                            <p class="mt-8 text-xs text-slate-400 italic text-center">Tip: Financial Forecasts (Profit/Loss, Cash Flow, Break-even) are the most critical for securing capital.</p>
                        </div>
                    </div>
                `;
            } else if (state.view === 'abc-case') {
                app.innerHTML = `
                    <div class="space-y-8 animate-in flex flex-col h-full">
                        <div class="flex items-center justify-between">
                            <button onclick="setView('welcome')" class="flex items-center gap-2 text-sky-600 font-bold hover:underline">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <div class="bg-sky-100 text-sky-700 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest">Abraca (ABC) Case Lab</div>
                        </div>

                        <div class="bg-sky-900 text-white p-8 rounded-[50px] shadow-xl relative overflow-hidden flex-shrink-0">
                            <div class="absolute top-0 right-0 p-8 opacity-20"><i class="fa-solid fa-industry text-8xl"></i></div>
                            <h2 class="text-4xl font-black mb-2 tracking-tighter italic">ABC: Circular Economy Project</h2>
                            <p class="text-sky-300 text-sm max-w-xl">Use the questions below to extract facts from the pre-released statement and build your project.</p>
                        </div>

                        <div class="flex-grow overflow-y-auto space-y-6 pr-2 scrollbar-hide">
                            ${abcCasePlan.map((step, i) => `
                                <div class="bg-white p-6 rounded-[35px] border-2 border-sky-100 shadow-sm flex flex-col md:flex-row gap-6">
                                    <div class="md:w-1/3">
                                        <span class="text-[10px] font-black text-sky-400 uppercase block mb-1">Project Phase ${i+1}</span>
                                        <h4 class="font-black text-xl text-slate-800 mb-2">${step.section}</h4>
                                        <div class="bg-sky-50 p-4 rounded-2xl border border-sky-100">
                                            <p class="text-[10px] font-bold text-sky-800 leading-relaxed italic">"${step.abcFocus}"</p>
                                        </div>
                                    </div>
                                    <div class="md:w-2/3 border-l border-slate-100 md:pl-6">
                                        <span class="text-[10px] font-black text-slate-400 uppercase block mb-3">5 Drafting Questions</span>
                                        <ul class="grid grid-cols-1 gap-2">
                                            ${step.questions.map((q, j) => `
                                                <li class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                    <i class="fa-solid fa-circle-question text-sky-400 text-sm shrink-0"></i>
                                                    <p class="text-[10px] font-medium text-slate-600">${q}</p>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.view === 'situational' || state.view === 'growth') {
                const isSituational = state.view === 'situational';
                const tools = isSituational ? ['swot', 'steeple'] : ['ansoff', 'bcg'];
                const colors = isSituational ? ['emerald', 'indigo'] : ['rose', 'sky'];
                const icons = isSituational ? ['fa-shield-halved', 'fa-globe'] : ['fa-bullseye', 'fa-chart-pie'];

                app.innerHTML = `
                    <div class="space-y-8 animate-in flex flex-col h-full">
                        <div class="flex items-center justify-between">
                            <button onclick="setView('welcome')" class="flex items-center gap-2 text-sky-600 font-bold hover:underline">
                                <i class="fa-solid fa-chevron-left"></i> Back
                            </button>
                            <div class="bg-slate-100 text-slate-700 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest">
                                ${isSituational ? 'Situational Analysis' : 'Growth & Portfolio Tools'}
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 flex-shrink-0">
                            ${tools.map((t, idx) => `
                                <button onclick="toggleToolQs('${t}')" class="p-6 rounded-3xl border-2 transition-all flex flex-col items-center gap-2 ${state.activeToolQs === t ? `bg-${colors[idx]}-500 text-white border-${colors[idx]}-600 shadow-lg` : 'bg-white text-slate-600 border-slate-100 hover:border-slate-200'}">
                                    <i class="fa-solid ${icons[idx]} text-2xl"></i>
                                    <h4 class="font-black text-sm uppercase">${t.toUpperCase()} Practice (10 Qs)</h4>
                                </button>
                            `).join('')}
                        </div>

                        ${state.activeToolQs ? `
                            <div class="bg-slate-50 p-6 rounded-[40px] border-2 border-slate-200 flex-grow overflow-y-auto scrollbar-hide">
                                <h4 class="font-black text-xs uppercase mb-4 text-slate-400">Practice Lab: ${state.activeToolQs.toUpperCase()}</h4>
                                <div class="grid grid-cols-1 gap-3">
                                    ${toolQuestions[state.activeToolQs].map((item, i) => `
                                        <div class="bg-white p-4 rounded-2xl shadow-sm text-[11px] border border-slate-100">
                                            <div class="flex justify-between items-start gap-4 mb-2">
                                               <div class="flex gap-3">
                                                  <span class="font-black text-sky-500">${i+1}</span>
                                                  <p class="text-slate-800 font-bold">${item.q}</p>
                                               </div>
                                               <button onclick="toggleAnswer('${state.activeToolQs}-${i}')" class="p-2 hover:bg-slate-100 rounded-lg shrink-0">
                                                  <i class="fa-solid fa-eye ${state.revealedAnswers[`${state.activeToolQs}-${i}`] ? 'text-sky-500' : 'text-slate-300'} text-xs"></i>
                                               </button>
                                            </div>
                                            ${state.revealedAnswers[`${state.activeToolQs}-${i}`] ? `
                                               <p class="text-sky-600 bg-sky-50 p-3 rounded-xl border-l-4 border-sky-400 animate-in italic font-medium">
                                                 ${item.a}
                                               </p>
                                            ` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : `
                            <div class="flex-grow flex items-center justify-center bg-slate-50 border-4 border-dashed border-slate-200 rounded-[40px]">
                                <p class="text-slate-400 font-bold">Select a tool above to start the 10-Question Practice Lab</p>
                            </div>
                        `}
                    </div>
                `;
            }
        }

        // --- INIT ---
        render();
    </script>
</body>
</html>
